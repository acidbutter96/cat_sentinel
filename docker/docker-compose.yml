services:
  postgres:
    image: postgres:16-alpine
    container_name: cat-sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cat_sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cat_sentinel}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rats_sentinell}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
