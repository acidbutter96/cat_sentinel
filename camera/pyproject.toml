[tool.poetry]
name = "jortan-camera-api"
version = "0.1.0"
description = "RTSP-to-HTTP bridge and PTZ control for the TP-Link Tapo C200 IP camera: live MJPEG streaming, snapshots, DB-backed recordings, pan/tilt control, and a detection-event ingestion/webhook pipeline for the cat-sentinel CV microservice."
authors = ["Marcos Pereira <marcos.p.10@hotmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
greenlet = "^3.1.0"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
av = "^13.1.0"
pillow = "^10.4.0"
jinja2 = "^3.1.4"
python-multipart = "^0.0.9"
pytapo = "^3.4.18"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
