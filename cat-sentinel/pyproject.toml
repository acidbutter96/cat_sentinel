[tool.poetry]
name = "cat-sentinel"
version = "0.1.0"
description = "Detects and tracks cats via a camera feed and alerts when a cat enters a danger zone."
authors = ["Marcos Pereira <marcos.p.10@hotmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
greenlet = "^3.0.0"
httpx = "^0.27.0"
ultralytics = "^8.3.0"
numpy = ">=1.26.0,<3.0.0"
opencv-python-headless = "^4.10.0"
torch = "^2.3.0"
torchvision = "^0.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
